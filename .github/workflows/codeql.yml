# CodeQL static analysis for the template repository's own executable
# surface:
#   - actions: this repository's workflow files (untrusted-input injection,
#     dangerous triggers, credential leaks)
#   - python: the cookiecutter generation hooks (hooks/)
# The project sources under '{{cookiecutter.project_slug}}/' are Jinja
# templates — not valid Python until rendered — so python analysis is scoped
# to hooks/. Generated projects ship their own CodeQL workflow that scans the
# rendered application code.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly re-scan picks up newly released CodeQL queries.
    - cron: "24 6 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            paths: .github
          - language: python
            paths: hooks
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: ${{ matrix.language }}
          config: |
            paths:
              - ${{ matrix.paths }}

      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: "/language:${{ matrix.language }}"
