name: Feature request
description: Propose an improvement to the template or its generated output.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Not sure it fits the template? Open a
        [Discussion](https://github.com/mohandoz/fastapi-bedrock/discussions)
        first — some integrations are better served as a
        [recipe](https://mohandoz.github.io/fastapi-bedrock/recipes/) than as
        a new `use_*` flag.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: >-
        Describe the situation in a generated project (or in generating one)
        that is painful today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: >-
        What should the template do? If it needs a new cookiecutter variable,
        suggest a name and default.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Generated project code (src/, tests/)
        - Template options / flags (cookiecutter.json, hooks)
        - Generated CI / Docker / deployment
        - Recipes / documentation
        - Template repo itself (CI, docs site)
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: >-
        Other approaches — including "document it as a recipe" or "do it in my
        project after generation" — and why they fall short.
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a PR for this.
