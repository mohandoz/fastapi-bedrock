[project]
name = "{{ cookiecutter.package_name }}"
version = "{{ cookiecutter.version }}"
description = "{{ cookiecutter.project_description }}"
readme = "README.md"
requires-python = ">={{ cookiecutter.python_version }}"
license = { text = "MIT" }
authors = [{ name = "{{ cookiecutter.author_name }}", email = "{{ cookiecutter.author_email }}" }]
dependencies = [
    "fastapi[standard]>=0.115",
    "sqlmodel>=0.0.22",
    "greenlet>=3.1",
    "pydantic-settings>=2.5",
    "pydantic[email]>=2.9",
    "alembic>=1.13",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",
    "structlog>=24.4",
{%- if cookiecutter.use_auth == "yes" %}
    "pyjwt>=2.9",
    "pwdlib[argon2]>=0.2",
{%- endif %}
{%- if cookiecutter.use_rate_limiting == "yes" %}
    "slowapi>=0.1.9",
{%- endif %}
{%- if cookiecutter.use_sentry == "yes" %}
    "sentry-sdk[fastapi]>=2.14",
{%- endif %}
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "polyfactory>=2.17",
    "httpx>=0.27",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/{{ cookiecutter.package_name }}"]

[tool.ruff]
line-length = 100
target-version = "py{{ cookiecutter.python_version | replace('.', '') }}"
src = ["src", "tests"]
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "SIM",      # flake8-simplify
    "TID",      # flake8-tidy-imports
    "ASYNC",    # flake8-async
    "S",        # flake8-bandit (security)
    "RUF",      # ruff-specific rules
]
ignore = [
    "B008",  # function call in default argument (FastAPI Depends pattern)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "S311"]
"migrations/**/*.py" = ["E501", "N999"]

[tool.ruff.lint.isort]
known-first-party = ["{{ cookiecutter.package_name }}"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "{{ cookiecutter.python_version }}"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
exclude = ["migrations/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov={{ cookiecutter.package_name }} --cov-report=term-missing"

[tool.coverage.run]
source = ["src/{{ cookiecutter.package_name }}"]
omit = ["*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
