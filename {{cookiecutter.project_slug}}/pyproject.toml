[project]
name = "{{ cookiecutter.package_name }}"
version = "{{ cookiecutter.version }}"
description = "{{ cookiecutter.project_description }}"
readme = "README.md"
requires-python = ">={{ cookiecutter.python_version }}"
license = { text = "MIT" }
authors = [{ name = "{{ cookiecutter.author_name }}", email = "{{ cookiecutter.author_email }}" }]
dependencies = [
    "fastapi[standard]>=0.118",
    "sqlmodel>=0.0.22",
    "greenlet>=3.1",
    "pydantic-settings>=2.5",
    "pydantic[email]>=2.9",
    "alembic>=1.13",
    "asyncpg>=0.30",
    "structlog>=24.4",
    "typer>=0.15",
{%- if cookiecutter.use_auth == "yes" %}
    "pyjwt>=2.9",
    "pwdlib[argon2]>=0.2",
    "jinja2>=3.1",
{%- endif %}
{%- if cookiecutter.use_rate_limiting == "yes" %}
    "slowapi>=0.1.9",
{%- endif %}
{%- if cookiecutter.use_sentry == "yes" %}
    "sentry-sdk[fastapi]>=2.14",
{%- endif %}
{%- if cookiecutter.use_temporal == "yes" %}
    "temporalio>=1.30,<2",
{%- endif %}
{%- if cookiecutter.use_redis == "yes" %}
    "redis[hiredis]>=5",
{%- endif %}
{%- if cookiecutter.use_observability == "yes" %}
    "opentelemetry-sdk>=1.44",
    "opentelemetry-exporter-otlp-proto-http>=1.44",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.65b0",
{%- endif %}
{%- if cookiecutter.use_redis == "yes" and cookiecutter.use_observability == "yes" %}
    "opentelemetry-instrumentation-redis>=0.65b0",
{%- endif %}
{%- if cookiecutter.use_http_client == "yes" %}
    "stamina>=24",
{%- endif %}
{%- if cookiecutter.use_http_client == "yes" and cookiecutter.use_observability == "yes" %}
    "opentelemetry-instrumentation-httpx>=0.65b0",
{%- endif %}
]

[project.scripts]
{{ cookiecutter.project_slug }} = "{{ cookiecutter.package_name }}.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "polyfactory>=2.17",
    "httpx>=0.27",
    "pre-commit>=4.0",
    "pytest-randomly>=3.15",
    "testcontainers[postgres{% if cookiecutter.use_redis == "yes" %},redis{% endif %}]>=4.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/{{ cookiecutter.package_name }}"]

[tool.ruff]
line-length = 100
target-version = "py{{ cookiecutter.python_version.split('.')[:2] | join('') }}"
src = ["src", "tests"]
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "SIM",      # flake8-simplify
    "TID",      # flake8-tidy-imports
    "ASYNC",    # flake8-async
    "S",        # flake8-bandit (security)
    "RUF",      # ruff-specific rules
]
ignore = [
    "B008",  # function call in default argument (FastAPI Depends pattern)
    "E501",  # line length is governed by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "S311"]
"migrations/**/*.py" = ["E501", "N999"]

[tool.ruff.lint.isort]
known-first-party = ["{{ cookiecutter.package_name }}"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "{{ cookiecutter.python_version.split('.')[:2] | join('.') }}"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
exclude = ["migrations/"]

[[tool.mypy.overrides]]
# Tests are type-checked too, but relaxed around third-party test helpers
# (pytest fixtures, testcontainers) that are not fully typed.
module = "tests.*"
disallow_untyped_decorators = false
warn_return_any = false
{%- if cookiecutter.use_rate_limiting == "yes" %}

[[tool.mypy.overrides]]
# slowapi's @limiter.exempt decorator is untyped.
module = "{{ cookiecutter.package_name }}.api.health"
disallow_untyped_decorators = false
{%- endif %}

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov={{ cookiecutter.package_name }} --cov-report=term-missing"
filterwarnings = [
    # Third-party noise: testcontainers' redis module still uses its own deprecated
    # @wait_container_is_ready decorator at import time (testcontainers 4.14.x).
    "ignore:The @wait_container_is_ready decorator is deprecated:DeprecationWarning:testcontainers",
]

[tool.coverage.run]
source = ["src/{{ cookiecutter.package_name }}"]
omit = [
    "*/migrations/*",
{%- if cookiecutter.use_temporal == "yes" %}
    "*/temporal/worker.py",
    "*/temporal/client.py",
{%- endif %}
{%- if cookiecutter.use_observability == "yes" %}
    "*/core/observability.py",
{%- endif %}
{%- if cookiecutter.use_redis == "yes" %}
    "*/core/redis.py",
    "*/events/worker.py",
{%- endif %}
]

[tool.coverage.report]
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
