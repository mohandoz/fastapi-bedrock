[project]
name = "{{ cookiecutter.package_name }}"
version = "{{ cookiecutter.version }}"
description = "{{ cookiecutter.project_description }}"
readme = "README.md"
requires-python = ">={{ cookiecutter.python_version }}"
license = { text = "MIT" }
authors = [{ name = "{{ cookiecutter.author_name }}", email = "{{ cookiecutter.author_email }}" }]
dependencies = [
    # standard-no-fastapi-cloud-cli = the [standard] extra minus fastapi-cloud-cli
    # (commercial deploy tooling + its telemetry); `fastapi run` still works.
    "fastapi[standard-no-fastapi-cloud-cli]>=0.139",
    # Explicit floor: Starlette < 1.0.1 is vulnerable to BadHost
    # (CVE-2026-48710), a Host-header auth bypass with no 0.x backport.
    "starlette>=1.0.1",
    "sqlmodel>=0.0.22",
    "greenlet>=3.1",
    "pydantic-settings>=2.5",
    # 2.12 is the first release with Python 3.14 support. Pydantic v3 is
    # expected to be non-breaking for v2-idiomatic code, so no <3 cap.
    "pydantic[email]>=2.12",
    "alembic>=1.13",
    "asyncpg>=0.30",
    "structlog>=24.4",
    "typer>=0.15",
{%- if cookiecutter.use_auth == "yes" %}
    "pyjwt>=2.9",
    "pwdlib[argon2]>=0.2",
    "jinja2>=3.1",
{%- endif %}
{%- if cookiecutter.use_rate_limiting == "yes" %}
    "slowapi>=0.1.9",
{%- endif %}
{%- if cookiecutter.use_sentry == "yes" %}
    "sentry-sdk[fastapi]>=2.14",
{%- endif %}
{%- if cookiecutter.use_temporal == "yes" %}
    "temporalio>=1.30,<2",
{%- endif %}
{%- if cookiecutter.use_redis == "yes" %}
    # redis-py 8 defaults to RESP3 on the wire; core/redis.py pins the response
    # shapes explicitly so a lock upgrade can never flip them (see that module).
    "redis[hiredis]>=8,<9",
{%- endif %}
{%- if cookiecutter.use_observability == "yes" %}
    # The OTel Python logs signal (opentelemetry.sdk._logs, used by
    # core/observability.py) is still experimental and may break in any minor
    # release, so the SDK/exporter are bounded to <2 and the 0.x
    # instrumentations — which move in lockstep with the 1.x SDK — to a
    # matched beta band. Widen both bounds together, never one alone.
    "opentelemetry-sdk>=1.44,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.44,<2",
    "opentelemetry-instrumentation-fastapi>=0.65b0,<0.70b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.65b0,<0.70b0",
{%- endif %}
{%- if cookiecutter.use_redis == "yes" and cookiecutter.use_observability == "yes" %}
    "opentelemetry-instrumentation-redis>=0.65b0,<0.70b0",
{%- endif %}
{%- if cookiecutter.use_http_client == "yes" %}
    "stamina>=24",
    # <1.0: httpx 1.0 reshuffles the exception hierarchy ResilientHttpClient
    # dispatches on (https://github.com/encode/httpx/discussions/3436).
    # Lift the cap deliberately after re-testing the retry/breaker paths.
    "httpx>=0.28,<1.0",
{%- endif %}
{%- if cookiecutter.use_http_client == "yes" and cookiecutter.use_observability == "yes" %}
    "opentelemetry-instrumentation-httpx>=0.65b0,<0.70b0",
{%- endif %}
]

[project.scripts]
{{ cookiecutter.project_slug }} = "{{ cookiecutter.package_name }}.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.11",
    "pytest>=9",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7",
    "polyfactory>=2.17",
{%- if cookiecutter.use_http_client == "yes" %}
    # <1.0: see the httpx cap rationale in [project.dependencies].
{%- else %}
    # <1.0: httpx 1.0 reshuffles the public API and exception hierarchy
    # (https://github.com/encode/httpx/discussions/3436). Lift the cap
    # deliberately after re-running the test suite against it.
{%- endif %}
    "httpx>=0.28,<1.0",
    "pre-commit>=4.0",
    "pytest-randomly>=4",
    "testcontainers[postgres{% if cookiecutter.use_redis == "yes" %},redis{% endif %}]>=4.15",
]

[build-system]
# uv_build finds src/{{ cookiecutter.package_name }} by convention — no
# packages table needed. The band matches [tool.uv] required-version below.
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv]
# The post-generation hook runs `uv lock`; a version floor keeps contributor
# and CI uv skew from producing incompatible lockfiles.
required-version = ">=0.11"

[tool.ruff]
line-length = 100
target-version = "py{{ cookiecutter.python_version.split('.')[:2] | join('') }}"
src = ["src", "tests"]
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "SIM",      # flake8-simplify
    "TID",      # flake8-tidy-imports
    "ASYNC",    # flake8-async
    "S",        # flake8-bandit (security)
    "RUF",      # ruff-specific rules
]
ignore = [
    "B008",  # function call in default argument (FastAPI Depends pattern)
    "E501",  # line length is governed by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "S311"]
"migrations/**/*.py" = ["E501", "N999"]

[tool.ruff.lint.isort]
known-first-party = ["{{ cookiecutter.package_name }}"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "{{ cookiecutter.python_version.split('.')[:2] | join('.') }}"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
exclude = ["migrations/"]

[[tool.mypy.overrides]]
# Tests are type-checked too, but relaxed around third-party test helpers
# (pytest fixtures, testcontainers) that are not fully typed.
module = "tests.*"
disallow_untyped_decorators = false
warn_return_any = false
{%- if cookiecutter.use_rate_limiting == "yes" %}

[[tool.mypy.overrides]]
# slowapi's @limiter.exempt decorator is untyped.
module = "{{ cookiecutter.package_name }}.api.health"
disallow_untyped_decorators = false
{%- endif %}

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole session: session-scoped fixtures (testcontainers,
# future shared engines) and test bodies must share a loop, or SQLAlchemy raises
# "attached to a different loop". Keep both scopes in sync.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov={{ cookiecutter.package_name }} --cov-report=term-missing"

[tool.coverage.run]
source = ["src/{{ cookiecutter.package_name }}"]
omit = [
    "*/migrations/*",
{%- if cookiecutter.use_temporal == "yes" %}
    "*/temporal/worker.py",
    "*/temporal/client.py",
{%- endif %}
{%- if cookiecutter.use_observability == "yes" %}
    "*/core/observability.py",
{%- endif %}
{%- if cookiecutter.use_redis == "yes" %}
    "*/core/redis.py",
    "*/events/worker.py",
{%- endif %}
]

[tool.coverage.report]
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
