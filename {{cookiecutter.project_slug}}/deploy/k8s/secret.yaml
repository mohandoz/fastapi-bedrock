# EXAMPLE ONLY — replace every value and never commit real secrets. In
# production, sync this Secret from your secret manager instead of applying it
# by hand: External Secrets Operator (https://external-secrets.io) or the
# Secrets Store CSI driver. See SECURITY.md.
#
# The Deployment and migration Job mount this Secret as files under
# /run/secrets, where pydantic-settings reads /run/secrets/<field_name>
# natively (`secrets_dir` in core/config.py) — so keys must be lower-case
# Settings field names. File-mounted secrets are preferred over env vars,
# which leak via `kubectl describe pod`, crash dumps and child processes.
apiVersion: v1
kind: Secret
metadata:
  name: {{ cookiecutter.project_slug }}-secrets
  namespace: {{ cookiecutter.project_slug }}
stringData:
  database_url: postgresql+asyncpg://app:change-me@postgres.example.internal:5432/{{ cookiecutter.package_name }}
{%- if cookiecutter.use_auth == "yes" %}
  # Generate one: python -c "import secrets; print(secrets.token_urlsafe(48))"
  secret_key: change-me-to-a-long-random-secret-of-at-least-32-chars
{%- endif %}
{%- if cookiecutter.use_redis == "yes" %}
  redis_url: redis://redis.example.internal:6379/0
{%- endif %}
