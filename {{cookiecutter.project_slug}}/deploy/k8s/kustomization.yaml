apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: {{ cookiecutter.project_slug }}
resources:
  - common
  - service.yaml
  - deployment.yaml
{%- if cookiecutter.use_redis == "yes" %}
  - events-worker.yaml
{%- endif %}
{%- if cookiecutter.use_temporal == "yes" %}
  - temporal-worker.yaml
{%- endif %}
images:
  # Keep this in sync with migration/kustomization.yaml. Prefer `digest:` over
  # `newTag:` once an immutable release image is published.
  - name: {{ cookiecutter.project_slug }}
    newName: registry.example.com/{{ cookiecutter.project_slug }}
    newTag: {{ cookiecutter.version | tojson }}
