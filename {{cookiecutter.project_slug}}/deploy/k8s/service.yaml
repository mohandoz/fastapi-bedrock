apiVersion: v1
kind: Service
metadata:
  name: {{ cookiecutter.project_slug }}
  namespace: {{ cookiecutter.project_slug }}
  labels:
    app.kubernetes.io/name: {{ cookiecutter.project_slug }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ cookiecutter.project_slug }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
