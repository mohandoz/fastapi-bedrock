# Non-secret runtime configuration shared by the migration, API and workers.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ cookiecutter.project_slug }}-config
  namespace: {{ cookiecutter.project_slug }}
data:
  ENVIRONMENT: production
  LOG_LEVEL: INFO
  # Keep localhost for image/Kubernetes health probes.
  ALLOWED_HOSTS: api.example.com,localhost
  CORS_ORIGINS: https://app.example.com
  # Replace with the ingress controller CIDR. Never expose a pod directly while
  # this remains "*", or clients can spoof forwarding headers and rate-limit IPs.
  FORWARDED_ALLOW_IPS: "10.0.0.0/8"
{%- if cookiecutter.use_temporal == "yes" %}
  TEMPORAL_HOST: temporal-frontend.temporal:7233
  TEMPORAL_NAMESPACE: default
  TEMPORAL_TASK_QUEUE: {{ cookiecutter.package_name }}-tq
{%- endif %}
{%- if cookiecutter.use_observability == "yes" %}
  OTEL_ENABLED: "true"
  OTEL_SERVICE_NAME: {{ cookiecutter.package_name }}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
{%- endif %}
