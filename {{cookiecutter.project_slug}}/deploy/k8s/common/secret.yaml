# EXAMPLE ONLY. Replace every value or sync this Secret from a secret manager.
# Keys are lower-case Settings field names because the volume is mounted at
# /run/secrets and read by pydantic-settings.
apiVersion: v1
kind: Secret
metadata:
  name: {{ cookiecutter.project_slug }}-secrets
  namespace: {{ cookiecutter.project_slug }}
stringData:
  database_url: postgresql+asyncpg://app:change-me@postgres.example.internal:5432/{{ cookiecutter.package_name }}
{%- if cookiecutter.use_auth == "yes" %}
  # Deliberate production-rejected sentinel; generate a token_urlsafe(48) value.
  secret_key: change-me-to-a-long-random-secret
{%- endif %}
{%- if cookiecutter.use_redis == "yes" %}
  redis_url: redis://redis.example.internal:6379/0
{%- endif %}
{%- if cookiecutter.use_llm_example == "yes" %}
  anthropic_api_key: replace-with-secret-manager-value
{%- endif %}
