# Replicated-safe migration path: apply schema changes from ONE place per
# release instead of running `alembic upgrade head` in every replica's
# entrypoint (which races). App pods never run migrations.
#
# Job specs are immutable, so each release deletes and re-creates it — see
# deploy/README.md for the full release flow.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ cookiecutter.project_slug }}-migrate
  namespace: {{ cookiecutter.project_slug }}
  labels:
    app.kubernetes.io/name: {{ cookiecutter.project_slug }}-migrate
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ cookiecutter.project_slug }}-migrate
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          # Kept in lockstep with the Deployment: kustomization.yaml rewrites
          # both images in one place.
          image: {{ cookiecutter.project_slug }}:latest
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: {{ cookiecutter.project_slug }}-config
          volumeMounts:
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: secrets
          secret:
            secretName: {{ cookiecutter.project_slug }}-secrets
            defaultMode: 0440
