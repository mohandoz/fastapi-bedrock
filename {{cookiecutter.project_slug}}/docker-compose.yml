services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: local
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/{{ cookiecutter.package_name }}
      CORS_ORIGINS: http://localhost:3000
{%- if cookiecutter.use_auth == "yes" %}
      SECRET_KEY: local-development-secret-change-me
{%- endif %}
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
      fastapi run src/{{ cookiecutter.package_name }}/main.py --host 0.0.0.0 --port 8000"

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: {{ cookiecutter.package_name }}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
