name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Ensure uv.lock is committed
        run: |
          if [ ! -f uv.lock ]; then
            uv lock
            echo "::error file=uv.lock::uv.lock is missing from the repository. Run 'uv lock' locally and commit the file — CI and the Docker build require a committed lockfile."
            exit 1
          fi

      - name: Check uv.lock is up to date
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src tests

      - name: Run tests
        run: uv run pytest

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Audit dependencies for known vulnerabilities
        run: make audit

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # gitleaks scans the full commit history

      - name: Scan git history for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PR comments would need a `pull-requests: write` token; keep the
          # read-only token and rely on the job summary + SARIF artifact.
          GITLEAKS_ENABLE_COMMENTS: "false"
          # Organization-owned repos need a (free) license key:
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The Dockerfile only exists when the project was generated with
      # use_docker=yes. hashFiles evaluates on the runner after checkout and
      # returns '' when the file is absent, so the build is skipped cleanly.
      - name: Build Docker image
        if: ${{ hashFiles('Dockerfile') != '' }}
        run: docker build --tag ci-image .
