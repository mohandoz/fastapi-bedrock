name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# UV_MALWARE_CHECK (uv preview feature) makes every uv command that syncs the
# environment query the OSV malware feed and abort before a known-malicious
# package can execute — the install-time complement to the `uv audit` job.
env:
  UV_MALWARE_CHECK: "1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Ensure uv.lock is committed
        run: |
          if [ ! -f uv.lock ]; then
            uv lock
            echo "::error file=uv.lock::uv.lock is missing from the repository. Run 'uv lock' locally and commit the file — CI and the Docker build require a committed lockfile."
            exit 1
          fi

      - name: Check uv.lock is up to date
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src tests

      - name: Run tests
        run: uv run pytest

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      # `make audit` runs `uv audit` (OSV-backed, currently a uv preview
      # feature): it reads pyproject.toml + uv.lock natively, so no
      # requirements-txt export is needed.
      - name: Audit dependencies for known vulnerabilities
        run: make audit

      # PEP 751 standardized lockfile: pip >= 25.1 installs directly from it,
      # giving compliance tooling and uv-less consumers a hash-pinned view.
      # Published as a build artifact, not committed — uv.lock remains the
      # single source of truth.
      - name: Export PEP 751 lockfile (pylock.toml)
        run: uv export --locked --no-dev --no-emit-project --format pylock.toml -o pylock.toml

      - name: Upload pylock.toml
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pylock
          path: pylock.toml

  # Blocks PRs that introduce dependencies with known vulnerabilities or
  # OSV-flagged malware — the review-time complement to the scheduled audit.
  # Requires the repository dependency graph, which parses uv.lock natively
  # (enabled by default on public repos; private repos need GitHub Advanced
  # Security / Code Security enabled in the repository settings).
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Review new dependencies for known vulnerabilities
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0  # gitleaks scans the full commit history

      - name: Scan git history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PR comments would need a `pull-requests: write` token; keep the
          # read-only token and rely on the job summary + SARIF artifact.
          GITLEAKS_ENABLE_COMMENTS: "false"
          # Organization-owned repos need a (free) license key:
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The Dockerfile only exists when the project was generated with
      # use_docker=yes. hashFiles evaluates on the runner after checkout and
      # returns '' when the file is absent, so the build is skipped cleanly.
      - name: Build Docker image
        if: ${{ hashFiles('Dockerfile') != '' }}
        run: docker build --tag ci-image .
