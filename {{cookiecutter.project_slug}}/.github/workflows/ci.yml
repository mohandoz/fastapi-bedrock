name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Ensure uv.lock is committed
        run: |
          if [ ! -f uv.lock ]; then
            uv lock
            echo "::error file=uv.lock::uv.lock is missing from the repository. Run 'uv lock' locally and commit the file — CI and the Docker build require a committed lockfile."
            exit 1
          fi

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src tests

      - name: Run tests
        run: uv run pytest
