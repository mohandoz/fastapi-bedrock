{% raw -%}
# Static analysis (SAST) with CodeQL's Python taint tracking — catches
# data-flow issues (SQL injection, SSRF, path traversal, ...) beyond Ruff's
# pattern-based S rules.
#
# Repository requirements: code scanning is free for public repositories;
# private repositories need GitHub Code Security (Advanced Security) enabled
# under Settings -> Advanced Security before results can be uploaded.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly re-scan picks up newly released CodeQL queries against
    # unchanged code.
    - cron: "24 6 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"
{%- endraw %}
