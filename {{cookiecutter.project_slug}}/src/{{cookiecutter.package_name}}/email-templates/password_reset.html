{% raw %}<!doctype html>
<html lang="en">
  <body style="margin: 0; padding: 24px; background: #f4f4f5; font-family: system-ui, -apple-system, sans-serif; color: #18181b;">
    <div style="max-width: 480px; margin: 0 auto; background: #ffffff; border-radius: 8px; padding: 32px;">
      <h1 style="margin: 0 0 16px; font-size: 20px;">{{ project_name }}</h1>
      <p style="margin: 0 0 16px; line-height: 1.5;">
        We received a request to reset the password for your account.
      </p>
      <p style="margin: 0 0 24px;">
        <a href="{{ link }}" style="display: inline-block; padding: 10px 20px; background: #18181b; color: #ffffff; text-decoration: none; border-radius: 6px;">Reset password</a>
      </p>
      <p style="margin: 0; font-size: 13px; color: #52525b; line-height: 1.5;">
        This link expires in {{ expire_minutes }} minutes. If you did not request
        a password reset, you can safely ignore this email.
      </p>
    </div>
  </body>
</html>{% endraw %}
